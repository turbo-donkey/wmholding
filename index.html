<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Please Bear With Us</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(180deg, #485267 0%, #526378 100%);
      font-family: 'Inter', sans-serif;
      color: #5ab5e1;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 560px;
    }

    .logo {
      width: 180px;
      margin: 0 auto 2.5rem;
      display: block;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: #5ab5e1;
      margin: 1.5rem auto;
      opacity: 0.5;
      border-radius: 2px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 1rem;
      opacity: 0.95;
    }

    p {
      font-size: 1rem;
      font-weight: 300;
      line-height: 1.75;
      opacity: 0.8;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="wmlogo.png" alt="Logo">
    <div class="divider"></div>
    <h1>We'll Be Right Back</h1>
    <p>Please bear with us as we migrate our hosting.<br>We'll be back up and running shortly.</p>
  </div>
</body>
</html>
